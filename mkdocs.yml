site_name: UPSC GS & Anthropology PYQs with Solutions

theme:
  name: material
  features:
    - navigation.tabs
    - search.suggest
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - GS Paper 1:
      - History: gs1/history.md
      - Geography: gs1/geography.md
      - Indian Society: gs1/society/indian-society.md

  - GS Paper 2:
      - Polity: gs2/modern-history.md
      - Governance: gs2/indian-society.md

  - GS Paper 3:
      - Economy: gs3/
      - Agriculture: gs3/

  - GS Paper 4:
      - Polity: gs2/modern-history.md
      - Governance: gs2/indian-society.md

  - Anthropology:
      - Paper 1: anthro/paper-1.md
      - Paper 2: anthro/paper-2.md
